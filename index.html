<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>КВИЗЛЁНЯ</title>

    <script>
      (function (w, d, s, o) {
        var j = d.createElement(s);
        j.async = true;
        j.src = 'https://script.marquiz.ru/v2.js';
        j.onload = function () {
          if (document.readyState !== 'loading') Marquiz.init();
          else document.addEventListener('DOMContentLoaded', Marquiz.init);
        };
        d.head.appendChild(j);
      })(window, document, 'script');
    </script>
  </head>

  <body>
    <h1 style="text-align: center">КВИЗЛЁНЯ 💥</h1>

    <div data-marquiz-id="69ef2ea44d59b50019b6b511"></div>

    <script>
      (function (t, p) {
        window.Marquiz
          ? Marquiz.add([t, p])
          : document.addEventListener('marquizLoaded', function () {
              Marquiz.add([t, p]);
            });
      })('Inline', {
        id: '69ef2ea44d59b50019b6b511',
        buttonText: 'Старт',
        bgColor: '#f4e4ba',
        textColor: '#000000',
        height: '1600',
      });
    </script>
  </body>
</html>
