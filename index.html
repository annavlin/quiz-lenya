<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квиз Лёня</title>

<!-- Marquiz -->
<script>
(function (w, d, s, o) {
  var j = d.createElement(s);
  j.async = true;
  j.src = 'https://script.marquiz.ru/v2.js';
  j.onload = function () {
    Marquiz.init(o);
  };
  d.head.appendChild(j);
})(window, document, 'script', {
  host: 'https://quiz.marquiz.ru',
  region: 'ru',
  id: '69ef2ea44d59b50019b6b511',
  autoOpen: 0
});
</script>

<style>
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: sans-serif;
}

.container {
  display: flex;
  height: 100vh;
}

.left {
  width: 50%;
  padding: 80px;
}

.right {
  width: 50%;
}

.right img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

  margin-top: 30px;
  padding: 15px 25px;
  font-size: 18px;
  cursor: pointer;

</style>
</head>

<body>

<div class="container">

  <div class="left">
    <h1>Насколько хорошо вы знаете юбиляра?</h1>

  <div class="right">
    <img src="https://picsum.photos/800/1200">
  </div>

</div>

<script>
function openQuiz() {
  if (window.Marquiz) {
    Marquiz.showModal();
  } else {
    alert("Квиз ещё загружается, попробуй через секунду");
  }
}
</script>
