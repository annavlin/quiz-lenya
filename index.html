<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квиз Лёня</title>

<!-- Marquiz -->
<script>
(function (w, d, s, o) {
  var j = d.createElement(s);
  j.async = true;
  j.src = '//script.marquiz.ru/v2.js';
  j.onload = function () {
    if (document.readyState !== 'loading') Marquiz.init(o);
    else document.addEventListener('DOMContentLoaded', function () {
      Marquiz.init(o);
    });
  };
  d.head.insertBefore(j, d.head.firstElementChild);
})(window, document, 'script', {
  host: '//quiz.marquiz.ru',
  region: 'ru',
  id: '69ef2ea44d59b50019b6b511',
  autoOpen: 0,
  disableOnMobile: true
});
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: #0f172a;
  color: white;
  height: 100vh;
  overflow: hidden;
}

.container {
  display: flex;
  height: 100vh;
}

/* ЛЕВО */
.left {
  width: 50%;
  padding: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(90deg, #0f172a 0%, rgba(15,23,42,0.85) 60%, rgba(15,23,42,0.4) 100%);
  z-index: 2;
}

.title {
  font-size: 42px;
  font-weight: 600;
  margin-bottom: 20px;
}

.subtitle {
  font-size: 18px;
  opacity: 0.7;
  margin-bottom: 40px;
  line-height: 1.5;
}

/* КНОПКА */
.quiz-btn {
  width: 180px;
  height: 50px;
  border-radius: 10px;
  border: 1px solid #d4b98a;
  background: transparent;
  color: #d4b98a;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.quiz-btn:hover {
  background: #d4b98a;
  color: black;
  transform: translateY(-2px);
}

/* ПРАВО */
.right {
  width: 50%;
  position: relative;
}

.right img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at left, rgba(15,23,42,0.7), transparent 60%);
}
</style>

</head>

<body>

<div class="container">

  <div class="left">
    <div class="title">
      Насколько хорошо вы знаете<br>
      нашего сегодняшнего юбиляра?
    </div>

    <div class="subtitle">
      Докажи соперникам, что именно ты самый внимательный,
      слушающий, а главное слышащий друг!
    </div>

    <button class="quiz-btn" onclick="openQuiz()">
      Погнали!
    </button>
  </div>

  <div class="right">
    <!-- СЮДА ВСТАВЬ СВОЮ КАРТИНКУ -->
    <img src="your-image.png">
    <div class="overlay"></div>
  </div>

</div>

<script>
function openQuiz() {
  Marquiz.showModal();
}
</script>

</body>
</html>
